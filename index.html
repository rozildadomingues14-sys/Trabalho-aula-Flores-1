<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <head>
    <meta charset="UTF-8">
    <title>Café Arte & Letra</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1 id="titulo">Bem-vindo ao Café Arte & Letra</h1>
    
    <img class="foto-cafe" src="arteletra.jpg" alt="Café Arte & Letra">

    <p class="descricao">
        Um espaço especial em Curitiba para apreciar café, cultura e bons momentos.
    </p>

    <a href="https://www.instagram.com/arteeletracafe/" target="_blank">
        Visite o nosso Instagram
    </a>

    <div class="secao-destaque">

        <h2>O que você encontra aqui</h2>

        <ul>
            <li>Cafés especiais</li>
            <li>Doces e acompanhamentos</li>
            <li>Ambiente cultural</li>
        </ul>

    </div>


    <form>

        <h2>Reserve sua mesa</h2>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome">

        <br><br>

        <label for="data">Data:</label>
        <input type="date" id="data" name="data">

        <br><br>

        <label for="pessoas">Número de pessoas:</label>
        <input type="number" id="pessoas" name="pessoas">

        <br><br>

        <button type="submit">Reservar</button>

    </form>

</body>

</html>
